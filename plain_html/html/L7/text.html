<!doctype html>
<html>
  <head>
    <title>Text Practice</title>
    <link rel="stylesheet" href="../../styles/L8/text.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <p class="video-title">
      Talking Tech and AI with Google CEO Sundar Pichail
    </p>

    <!-- all html elements come with a default margin which can be readjusted by setting it to 0
then redefining it -->

    <p class="views-title">3.4M views &#183; 6 months ago</p>

    <p class="author-title">Marquees Brownlee &#10003;</p>

    <p class="description-title">
      Talking tech and AI on the heels of Google I/O. Also a daily driver phone
      reveal from Google's CEO. Shoutout to Sundar!
    </p>

    <p class="apple-text">
      Shop early for the best selection of holiday favourites.
      <span class="shop-link"> Shop now &#62; </span>
    </p>

    <!-- with css specificity the more specific the element the more priority is given to it -->
  </body>
</html>
