<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../styles/L9/nested_layouts.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <title>Nested Layouts</title>
</head>

<body>
  <input type="text" placeholder="Search" />
  <div id="outer-div-1">
    <img src="../../public/thumbnail-1.webp" alt="#" />
    <div id="channel-thumbnail">
      <div id="channel-div">
        <img id="channel-pic" src="../../public/channel-1.jpeg" alt="" />
      </div>
      <div id="info-div">
        <p id="title-p">
          Talking Tech and AI with Google CEO Sundar Pichail!
        </p>
        <p id="youtube-name">Marques Brownlee</p>
        <p id="youtube-details">3.4M views &#183; 6 months ago</p>
      </div>
    </div>
  </div>

  <div id="outer-div-2">
    <div id="outer-div-1">
      <img src="../../public/thumbnail-2.webp" alt="#" />
      <div id="channel-thumbnail">
        <div id="channel-div">
          <img id="channel-pic" src="../../public/channel-2.jpeg" alt="" />
        </div>
        <div id="info-div">
          <p id="title-p">
            Try Not To Laugh Challenge #9
          </p>
          <p id="youtube-name">Marques Brownlee</p>
          <p id="youtube-details">3.4M views &#183; 6 months ago</p>
        </div>
      </div>
    </div>
</body>

</html>
