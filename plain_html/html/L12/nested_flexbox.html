<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/L12/nested_flexbox.css">
    <title>Navbar</title>
</head>

<body>
    <div class="header">
        <!-- flexbox doesn't go 2 layers it only affects the first layer -->
        <div class="left__section">
            <img class="menu" src="/plain_html/public/icons/hamburger-menu.svg" alt="menu">
            <img class="youtube" src="/plain_html/public/icons/youtube-logo.svg" alt="youtube-logo">
        </div>
        <div class="middle__section">
            <input class="search-bar" type="text" placeholder="Search">
            <button class="search-button">
                <img src="/plain_html/public/icons/search.svg" alt="search">
            </button>
            <button class="voice-search-button">
                <img src="/plain_html/public/icons/voice-search-icon.svg" alt="voice-search">
            </button>
        </div>
        <div class="right__section">
            
        </div>
    </div>
</body>

</html>
