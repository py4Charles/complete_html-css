<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/L11/flexbox_practice.css">
    <title>Flexbox</title>
</head>

<body>
    <div style="display: flex;
                flex-direction: row;">
        <!-- with the flexbox it expands to take up the space that
                 the content takes up hence amking it a flexible box(flexbox) -->
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>texxt</p>
        </div>
    </div>

    <div style="margin-top: 30px;
                display: flex;
                flex-direction: row;">
        <!-- with the flexbox it expands to take up the space that
                 the content takes up hence amking it a flexible box(flexbox) -->
        <div style="width: 100px; 
                    background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;
                    flex: 1;">div 2 <p>flex: 1</p>
        </div>
    </div>

    <div style="margin-top: 30px;
                display: flex;
                flex-direction: row;">
        <!-- with the flexbox it expands to take up the space that
                 the content takes up hence amking it a flexible box(flexbox) -->
        <div style="width: 100px; 
                    background-color: lightblue;">div 1
        </div>
        <div style="background-color: lightpink;
                    flex: 1;"><p>flex: 1</p>
        </div>
        <div style="width: 100px; 
                    background-color: lightblue;
                    flex: 2;">flex: 2
        </div>
    </div>

</body>

</html>
