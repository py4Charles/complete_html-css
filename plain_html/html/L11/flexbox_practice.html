<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/L11/flexbox_practice.css">
    <title>Flexbox</title>
</head>

<body style="padding-bottom: 1200px;">
    <div style="display: flex;
                flex-direction: row;">
        <!-- with the flexbox it expands to take up the space that
                 the content takes up hence amking it a flexible box(flexbox) -->
        <div style="background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;">div 2 <p>texxt</p>
        </div>
    </div>

    <div style="margin-top: 30px;
                display: flex;
                flex-direction: row;">
        <div style="width: 100px; 
                    background-color: lightblue;">div 1</div>
        <div style="background-color: lightpink;
                    flex: 1;">div 2 <p>flex: 1</p>
        </div>
    </div>

    <div style="margin-top: 30px;
                display: flex;
                flex-direction: row;">
        <div style="width: 100px; 
                    background-color: lightblue;">div 1
        </div>
        <div style="background-color: lightpink;
                    flex: 1;">
            <p>flex: 1</p>
        </div>
        <div style="width: 100px; 
                    background-color: lightblue;
                    flex: 2;">flex: 2
        </div>
    </div>

    <div style="margin-top: 30px;
                display: flex;
                border: 1px solid gray;
                flex-direction: row;
                justify-content: center;">
                
        <!--  justify content in flex -> Used to position the flex item 
                by start, center or end -->

        <div style="width: 100px;
                    height: 50px; 
                    background-color: lightblue;">100px</div>

        <div style="background-color: lightpink;
                    height: 50px; 
                    width: 100px;">100px</div>
        
        <div style="width: 100px; 
                    background-color: lightblue;
                    height: 50px; 
                    width: 100px;">100px</div>
    </div>

</body>

</html>
